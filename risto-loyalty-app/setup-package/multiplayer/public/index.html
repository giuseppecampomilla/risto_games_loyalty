<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Corsa all'Ultimo Piatto</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;900&display=swap');

        :root {
            --bg-deep: #0a0f1a;
            --accent-green: #00ff88;
            --accent-red: #ff3366;
            --accent-gold: #ffd700;
            --text-main: #f8fafc;
            --glass: rgba(255, 255, 255, 0.05);
            --neon-shadow-green: 0 0 15px rgba(0, 255, 136, 0.5);
            --neon-shadow-red: 0 0 15px rgba(255, 51, 102, 0.5);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at center, #1a2333 0%, var(--bg-deep) 100%);
            color: var(--text-main);
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            user-select: none;
        }

        /* --- LOGIN SCREEN --- */
        #login-overlay {
            position: fixed;
            inset: 0;
            background: var(--bg-deep);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
        }

        .logo-title {
            font-size: 3rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--accent-gold), #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
        }

        .login-card {
            background: var(--glass);
            padding: 2.5rem;
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            width: 100%;
            max-width: 400px;
        }

        input[type="email"] {
            width: 100%;
            padding: 1rem;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            margin-bottom: 1.5rem;
            outline: none;
            box-sizing: border-box;
        }

        .btn-join {
            width: 100%;
            padding: 1rem;
            background: var(--accent-gold);
            color: black;
            border: none;
            border-radius: 12px;
            font-weight: 900;
            font-size: 1.1rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-join:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 215, 0, 0.3);
        }

        /* --- GAME ENGINE LAYOUT --- */
        #game-view {
            display: none;
            position: absolute;
            inset: 0;
            padding-bottom: 120px;
            box-sizing: border-box;
            width: 100%;
            height: 100%;
            flex-direction: row;
        }

        .player-lane {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding: 2rem 0;
            border-right: 1px solid rgba(255,255,255,0.05);
        }

        @media (max-width: 768px) {
            #game-view { 
                flex-direction: column; 
            }
            .player-lane {
                flex: none;
                height: 50%;
                width: 100%;
                padding: 0;
                justify-content: center;
                border-right: none;
                border-bottom: 1px solid rgba(255,255,255,0.05);
            }
            .progress-track {
                height: 25vh;
                margin-bottom: 0px;
                margin-top: 1.5rem;
            }
            .runner-icon {
                font-size: 1.8rem;
            }
            .lane-label {
                top: 0.5rem;
                font-size: 1rem;
                opacity: 0.6;
            }
            .goal-dish {
                font-size: 1.8rem;
                top: -30px;
            }
            
            /* Background colors to distinguish lanes */
            .you { background: rgba(0, 255, 136, 0.03); }
            .opponent { background: rgba(255, 51, 102, 0.03); }
        }

        .lane-label {
            position: absolute;
            top: 2rem;
            font-weight: 900;
            font-size: 1.5rem;
            opacity: 0.3;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Vertical Progress Bar */
        .progress-track {
            position: relative;
            width: 12px;
            height: 60vh;
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            margin-bottom: 2rem;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        .progress-fill {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 0%;
            border-radius: 20px;
            transition: height 0.1s ease-out;
        }

        .you .progress-fill { 
            background: linear-gradient(to top, #008855, var(--accent-green));
            box-shadow: var(--neon-shadow-green);
        }
        .opponent .progress-fill { 
            background: linear-gradient(to top, #880033, var(--accent-red));
            box-shadow: var(--neon-shadow-red);
        }

        /* Animated Icons */
        .runner-icon {
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2.5rem;
            transition: bottom 0.1s ease-out;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.3));
        }

        .goal-dish {
            position: absolute;
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2.5rem;
            animation: float 2s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translate(-50%, 0); }
            50% { transform: translate(-50%, -10px); }
        }

        /* --- CONTROLS --- */
        #controls-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 180px;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 50;
            padding-bottom: 2rem;
        }

        #btn-corri {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: var(--accent-gold);
            border: 8px solid rgba(255,255,255,0.2);
            font-family: 'Outfit', sans-serif;
            font-weight: 900;
            font-size: 1.8rem;
            color: black;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.4);
            transition: transform 0.1s, box-shadow 0.3s;
            display: none;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }

        #btn-corri:hover {
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.6);
            animation: pulse-gold 1.5s infinite;
        }

        #btn-corri:active {
            transform: scale(0.9);
        }

        @media (max-width: 768px) {
            #controls-bar {
                height: 120px;
                padding-bottom: 0.5rem;
            }
            #btn-corri {
                width: 100px;
                height: 100px;
                font-size: 1.3rem;
                border-width: 4px;
            }
        }

        @keyframes pulse-gold {
            0% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(255, 215, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0); }
        }

        /* --- STATUS INFO --- */
        #status-msg {
            position: fixed;
            top: 20%;
            width: 100%;
            text-align: center;
            font-size: 2rem;
            font-weight: 900;
            z-index: 10;
            pointer-events: none;
            background: linear-gradient(to bottom, rgba(10,15,26,0.8), transparent);
            padding: 1rem 0;
        }

        /* --- FINAL SCREEN --- */
        #final-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(15px);
            z-index: 200;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .result-title {
            font-size: 4rem;
            font-weight: 900;
            margin-bottom: 1rem;
        }

        .points-summary {
            font-size: 1.5rem;
            color: var(--accent-gold);
            margin-bottom: 2rem;
        }

        .total-balance {
            background: var(--glass);
            padding: 1.5rem 3rem;
            border-radius: 20px;
            border: 1px solid var(--accent-gold);
            font-size: 1.2rem;
        }

        .total-balance b {
            font-size: 2.2rem;
            display: block;
            margin-top: 0.5rem;
        }

        .btn-restart {
            margin-top: 2rem;
            padding: 1rem 2.5rem;
            border-radius: 14px;
            border: none;
            background: white;
            color: black;
            font-weight: 900;
            font-size: 1.1rem;
            cursor: pointer;
            width: 100%;
            max-width: 250px;
            transition: all 0.2s;
        }

        .btn-restart:active { transform: scale(0.95); }

        .btn-dashboard {
            margin-top: 0.8rem;
            padding: 1rem 2.5rem;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.3);
            background: transparent;
            color: white;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            max-width: 250px;
            transition: all 0.2s;
        }

        .btn-dashboard:hover {
            background: rgba(255,255,255,0.05);
            border-color: white;
        }

        /* --- WAITING ROOM --- */
        #waiting-room {
            position: fixed;
            inset: 0;
            background: var(--bg-deep);
            z-index: 150;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .waiting-msg {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--accent-gold);
            margin-bottom: 2rem;
            text-transform: uppercase;
        }

        .loader-ladle {
            font-size: 5rem;
            animation: spin-ladle 2s linear infinite;
        }

        @keyframes spin-ladle {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

    </style>
</head>
<body>

    <div id="status-msg"></div>

    <div id="waiting-room">
        <div class="loader-ladle">🥄</div>
        <div class="waiting-msg">In attesa di uno sfidante...</div>
    </div>

    <div id="login-overlay">
        <div class="logo-title">Corsa all'Ultimo Piatto</div>
        <div class="login-card">
            <p style="opacity: 0.7; margin-bottom: 1.5rem;">Inserisci la tua email WordPress per entrare in cucina!</p>
            <input type="email" id="email-input" placeholder="esempio@email.it">
            <button id="btn-join" class="btn-join">ENTRA IN GARA</button>
        </div>
    </div>

    <div id="game-view">
        <div class="player-lane you">
            <div class="lane-label">Tu</div>
            <div class="progress-track">
                <div class="goal-dish">🍽️</div>
                <div class="progress-fill" id="my-bar"></div>
                <div class="runner-icon" id="my-runner">👨‍🍳</div>
            </div>
        </div>
        <div class="player-lane opponent">
            <div class="lane-label">Avversario</div>
            <div class="progress-track">
                <div class="goal-dish">🍽️</div>
                <div class="progress-fill" id="opp-bar"></div>
                <div class="runner-icon" id="opp-runner">👨‍💼</div>
            </div>
        </div>
    </div>

    <div id="controls-bar">
        <button id="btn-corri">CORRI!</button>
    </div>

    <div id="final-overlay">
        <div id="result-text" class="result-title">HAI VINTO!</div>
        <div id="match-points" class="points-summary">+ 530 Punti Guadagnati</div>
        <div class="total-balance">
            IL TUO SALDO TOTALE
            <b id="total-points">0</b>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; width: 100%;">
            <button onclick="location.reload()" class="btn-restart">NUOVA GARA 🔄</button>
            <button onclick="window.location.href='http://130.110.6.128/'" class="btn-dashboard">TORNA ALLA DASHBOARD</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <script>
        const socket = io();
        const loginOverlay = document.getElementById('login-overlay');
        const gameView = document.getElementById('game-view');
        const finalOverlay = document.getElementById('final-overlay');
        const statusMsg = document.getElementById('status-msg');
        const btnCorri = document.getElementById('btn-corri');
        const waitingRoom = document.getElementById('waiting-room');
        
        const myBar = document.getElementById('my-bar');
        const myRunner = document.getElementById('my-runner');
        const oppBar = document.getElementById('opp-bar');
        const oppRunner = document.getElementById('opp-runner');

        let currentSettings = {
            multiplayerWinBonus: 500, 
            multiplayerClickMultiplier: 10,
            multiplayerTargetClicks: 60
        };

        let TARGET_SCORE = 600; // Valore di default (60 * 10)

        socket.on('sys-status', (data) => {
            console.log("System:", data);
        });

        document.getElementById('btn-join').addEventListener('click', () => {
            const email = document.getElementById('email-input').value.trim();
            if (email) {
                socket.emit('register', email);
                statusMsg.innerText = "Controllo credenziali...";
            }
        });

        // Auto-join se l'email è passata via URL (?email=...)
        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const emailFromUrl = params.get('email');
            if (emailFromUrl) {
                const emailInput = document.getElementById('email-input');
                emailInput.value = emailFromUrl;
                // Piccolo ritardo per garantire che socket.io sia pronto
                setTimeout(() => {
                    document.getElementById('btn-join').click();
                }, 800);
            }
        });

        socket.on('waiting', (msg) => {
            statusMsg.innerText = msg;
            waitingRoom.style.display = 'flex';
        });

        socket.on('match-found', (data) => {
            if (data.settings) {
                currentSettings = data.settings;
                // Calcolo dinamico del traguardo: Click Target * Valore ogni Click
                TARGET_SCORE = currentSettings.multiplayerTargetClicks * currentSettings.multiplayerClickMultiplier;
                console.log("🏅 Settings di gara:", currentSettings);
                console.log("🎯 Traguardo Finale (Punti):", TARGET_SCORE);
            }
            loginOverlay.style.display = 'none';
            gameView.style.display = 'flex';
            waitingRoom.style.display = 'flex'; // Resta visibile fino a game-start
            document.querySelector('.waiting-msg').innerText = "AVVERSARIO TROVATO! PREPARATI...";
            statusMsg.innerText = "";
        });

        socket.on('countdown', (count) => {
            if (count > 0) {
                statusMsg.style.fontSize = '4rem';
                statusMsg.innerText = count;
            } else {
                statusMsg.innerText = "CORRI!!!";
            }
        });

        socket.on('game-start', () => {
            statusMsg.innerText = "";
            waitingRoom.style.display = 'none';
            btnCorri.style.display = 'block';
            if (currentSettings.multiplayerClickMultiplier > 1) {
                btnCorri.innerText = `CORRI! (x${currentSettings.multiplayerClickMultiplier})`;
            }
        });

        btnCorri.addEventListener('click', () => {
            socket.emit('click');
        });

        // Tasti di scelta rapida
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'Enter') {
                if (btnCorri.style.display === 'block') btnCorri.click();
                e.preventDefault();
            }
        });

        socket.on('score-update', (scores) => {
            const myId = socket.id;
            const oppId = Object.keys(scores).find(id => id !== myId);
            
            // Update My Progress
            const myScore = scores[myId].score;
            const myPerc = Math.min(100, (myScore / TARGET_SCORE) * 100);
            myBar.style.height = myPerc + '%';
            myRunner.style.bottom = `calc(${myPerc}% - 20px)`;

            // Update Opponent Progress
            if (oppId) {
                const oppScore = scores[oppId].score;
                const oppPerc = Math.min(100, (oppScore / TARGET_SCORE) * 100);
                oppBar.style.height = oppPerc + '%';
                oppRunner.style.bottom = `calc(${oppPerc}% - 20px)`;
            }
        });

        socket.on('game-over', (data) => {
            console.log("🏁 Game Over Data:", data);
            const { winner, loyaltyPoints, totalBalances } = data;
            const myId = socket.id;

            btnCorri.style.display = 'none';
            statusMsg.innerText = "";
            
            finalOverlay.style.display = 'flex';
            
            if (winner === myId) {
                document.getElementById('result-text').innerText = "VITTORIA!";
                document.getElementById('result-text').style.color = "var(--accent-green)";
                confetti({
                    particleCount: 150,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#ffd700', '#ffffff', '#00ff88']
                });
            } else if (winner === null) {
                document.getElementById('result-text').innerText = "PAREGGIO";
                document.getElementById('result-text').style.color = "white";
            } else {
                document.getElementById('result-text').innerText = "SCONFITTA";
                document.getElementById('result-text').style.color = "var(--accent-red)";
            }

            document.getElementById('match-points').innerText = `+ ${loyaltyPoints[myId]} Punti Fedeltà`;
            const finalBalance = Number(totalBalances[myId] || 0);
            document.getElementById('total-points').innerText = finalBalance.toLocaleString();
        });

        socket.on('opponent-disconnected', () => {
            alert("L'avversario ha lasciato la cucina!");
            location.reload();
        });
        
        socket.on('auth-error', (err) => {
            alert(err);
            location.reload();
        });

    </script>
</body>
</html>
